# Builds the site with the photos uploaded during the trip and deploys it
# to GitHub Pages. Called by CI (a push to main that passed its checks)
# and by "Foto's ophalen" (photos.yml). The Drive secrets live in the
# github-pages environment, which only main may use, so pull requests and
# forks never see them and the originals never leave this job.
name: Deploy

on:
  workflow_call:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deploy halfway; a second one waits its turn
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@martijn500"
      - run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.PACKAGES_TOKEN }}
      # The share images and the photo processing render in Chromium
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Fetch and process uploaded photos
        run: npm run uploads
        env:
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
          GDRIVE_SERVICE_ACCOUNT: ${{ secrets.GDRIVE_SERVICE_ACCOUNT }}
          UPLOAD_PREVIEW_DAY: ${{ vars.UPLOAD_PREVIEW_DAY }}
      - run: npm run build
        env:
          UPLOAD_PREVIEW_DAY: ${{ vars.UPLOAD_PREVIEW_DAY }}
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
