version: 2
# The app's packages are private on GitHub Packages: Dependabot needs a
# token for them (Settings → Secrets → Dependabot: PACKAGES_TOKEN)
registries:
  github-packages:
    type: npm-registry
    url: https://npm.pkg.github.com
    token: ${{secrets.PACKAGES_TOKEN}}
updates:
  - package-ecosystem: npm
    directory: /
    registries:
      - github-packages
    schedule:
      interval: weekly
    # Wait before proposing a new release, like min-release-age in .npmrc;
    # not for the app's own packages
    cooldown:
      default-days: 7
      exclude:
        - "@martijn500/*"
    groups:
      app:
        patterns:
          - "@martijn500/*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
