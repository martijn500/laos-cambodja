<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAOS &amp; CAMBODJA: THE BRAINROT EXPEDITION 🚀🔥</title>
    <meta
      name="description"
      content="Reisdagboek van 18 dagen door Thailand, Laos en Cambodja: een kaart met per dag foto's, cartoons en een tijdlijn."
    />
    <link rel="canonical" href="https://martijn500.github.io/laos-cambodja/" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="nl_NL" />
    <meta
      property="og:title"
      content="Laos &amp; Cambodja: the brainrot expedition"
    />
    <meta
      property="og:description"
      content="Reisdagboek van 18 dagen door Thailand, Laos en Cambodja: een kaart met per dag foto's, cartoons en een tijdlijn."
    />
    <meta
      property="og:url"
      content="https://martijn500.github.io/laos-cambodja/"
    />
    <meta
      property="og:image"
      content="https://martijn500.github.io/laos-cambodja/img/slides/01/01.webp"
    />
    <meta name="theme-color" content="#09090b" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <script type="module" src="/src/main.js"></script>
  </head>
  <body class="is-booting">
    <div class="boot-loader" role="status" aria-live="polite">
      <div class="boot-pin" aria-hidden="true">
        <svg viewBox="0 0 10 13">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M3 0h4v1h1v1h1v5h-1v2h-1v2h-1v2h-2v-2h-1v-2h-1v-2h-1v-5h1v-1h1zM4 3v2h2v-2z"
          />
        </svg>
        <span class="boot-pin-shadow"></span>
      </div>
      <p class="boot-title">KAART LADEN<span class="boot-dots">...</span></p>
      <div class="boot-bar" aria-hidden="true">
        <span></span><span></span><span></span><span></span> <span></span
        ><span></span><span></span><span></span>
      </div>
      <p class="boot-day" id="boot-day"></p>
    </div>
    <!-- NAVIGATION CONTROLS: first in the DOM, so it is the first Tab stop -->
    <div class="nav-controls">
      <div class="timeline-heading">
        <span class="timeline-star" aria-hidden="true"></span>
        <span class="timeline-heading-title">REISDAGBOEK</span>
        <span class="timeline-divider" aria-hidden="true"></span>
        <span class="timeline-heading-meta">15 FEB — 4 MRT 2027</span>
        <span class="timeline-hint">· SCROLL DE ROUTE →</span>
      </div>
      <nav
        class="page-indicators"
        id="page-indicators"
        aria-label="Reistijdlijn: pijltjestoetsen wisselen van dag"
      ></nav>
      <div class="nav-actions">
        <button class="nav-btn nav-btn-prev" aria-label="Vorige pagina">
          <span class="nav-arrow" aria-hidden="true">▶</span>
        </button>
        <span
          class="progress-text"
          id="progress"
          aria-live="polite"
          aria-atomic="true"
        >
          <span class="progress-day">Dag 1</span>
          <span class="progress-icon" role="img" aria-label="Vlucht">✈️</span>
        </span>
        <button class="nav-btn nav-btn-next" aria-label="Volgende pagina">
          <span class="nav-arrow" aria-hidden="true">▶</span>
        </button>
      </div>
    </div>

    <div
      class="map-background"
      id="trip-map"
      role="region"
      aria-label="Minimap met de reisdagen in Laos en Cambodja"
    >
      <div class="map-shade" aria-hidden="true"></div>
      <svg class="map-popup-beam" id="map-popup-beam" aria-hidden="true">
        <g class="map-popup-beam-bars"></g>
      </svg>
    </div>
    <div class="map-status" id="map-status" role="status">Kaart laden…</div>
    <button class="sound-btn" type="button" aria-pressed="true">
      SFX: ON 🔊
    </button>
    <div class="map-attribution">
      <a
        href="https://www.openmaptiles.org/"
        target="_blank"
        rel="noopener noreferrer"
        >© OpenMapTiles</a
      >
      ·
      <a
        href="https://www.openstreetmap.org/copyright"
        target="_blank"
        rel="noopener noreferrer"
        >© OpenStreetMap</a
      >
    </div>
    <div class="deck"></div>
    <!-- One day card; src/slides/build.js fills a copy for every stop -->
    <template id="slide-template">
      <div class="slide">
        <div class="card">
          <div>
            <span class="tag"></span>
            <h2></h2>
            <p class="desc"></p>
            <blockquote></blockquote>
            <div class="stats-bar">
              <div class="stat-item">
                REISDAG
                <div class="stat-value"></div>
              </div>
              <div class="stat-item">
                OVERNACHTING
                <div class="stat-value"></div>
              </div>
            </div>
          </div>
          <div class="img-box"><img alt="" /></div>
        </div>
      </div>
    </template>
  </body>
</html>
