<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LAOS & CAMBODJA: THE BRAINROT EXPEDITION 🚀🔥</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%23ff007f'/><path d='M30,55 L45,35 L55,35 L48,50 L70,50 L75,42 L80,42 L76,55 L80,68 L75,68 L70,60 L48,60 L55,75 L45,75 Z' fill='%23ffee00'/><path d='M25,30 L27,25 L32,27 L27,29 Z M75,25 L80,28 L77,33 L74,29 Z M20,65 L25,67 L22,72 L18,69 Z' fill='%2300f0ff'/></svg>"
    />
    <link
      rel="apple-touch-icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23ff007f'/><path d='M30,55 L45,35 L55,35 L48,50 L70,50 L75,42 L80,42 L76,55 L80,68 L75,68 L70,60 L48,60 L55,75 L45,75 Z' fill='%23ffee00'/><path d='M25,30 L27,25 L32,27 L27,29 Z M75,25 L80,28 L77,33 L74,29 Z M20,65 L25,67 L22,72 L18,69 Z' fill='%2300f0ff'/></svg>"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.css"
      integrity="sha256-Q8HYhrX98KrE5xNb1vhLgj2fSCg6ZIASZl+b5SwBOJ8="
      crossorigin=""
    />
    <link rel="stylesheet" href="css/base.css" />
    <link rel="stylesheet" href="css/map.css" />
    <link rel="stylesheet" href="css/boot.css" />
    <link rel="stylesheet" href="css/slide.css" />
    <link rel="stylesheet" href="css/controls.css" />
    <!--
      Fetch every module at once instead of one import level at a time.
      Keep in sync with js/ (a test checks this).
    -->
    <link rel="modulepreload" href="js/main.js" />
    <link rel="modulepreload" href="js/audio.js" />
    <link rel="modulepreload" href="js/boot.js" />
    <link rel="modulepreload" href="js/data/itinerary.js" />
    <link rel="modulepreload" href="js/data/photos.js" />
    <link rel="modulepreload" href="js/data/themes.js" />
    <link rel="modulepreload" href="js/deck.js" />
    <link rel="modulepreload" href="js/input.js" />
    <link rel="modulepreload" href="js/map/beam.js" />
    <link rel="modulepreload" href="js/map/map.js" />
    <link rel="modulepreload" href="js/map/markers.js" />
    <link rel="modulepreload" href="js/map/popup.js" />
    <link rel="modulepreload" href="js/router.js" />
    <link rel="modulepreload" href="js/slides/build.js" />
    <link rel="modulepreload" href="js/slides/gallery.js" />
    <link rel="modulepreload" href="js/state.js" />
    <link rel="modulepreload" href="js/timeline.js" />
    <link rel="modulepreload" href="js/utils/color.js" />
    <link rel="modulepreload" href="js/utils/dom.js" />
    <!--
      Day routes (/dag-8) arrive via 404.html, which writes this page with
      document.write; stylesheets don't block painting then. Keep the page
      hidden until the script runs: scripts do wait for the stylesheets above.
    -->
    <style>
      html {
        background: #09090b;
      }
      body:not(.is-styled) {
        visibility: hidden;
      }
    </style>
  </head>
  <body class="is-booting">
    <div class="boot-loader" role="status" aria-live="polite">
      <div class="boot-pin" aria-hidden="true">
        <svg viewBox="0 0 10 13">
          <path
            fill="currentColor"
            fill-rule="evenodd"
            d="M3 0h4v1h1v1h1v5h-1v2h-1v2h-1v2h-2v-2h-1v-2h-1v-2h-1v-5h1v-1h1zM4 3v2h2v-2z"
          />
        </svg>
        <span class="boot-pin-shadow"></span>
      </div>
      <p class="boot-title">KAART LADEN<span class="boot-dots">...</span></p>
      <div class="boot-bar" aria-hidden="true">
        <span></span><span></span><span></span><span></span> <span></span
        ><span></span><span></span><span></span>
      </div>
      <p class="boot-day" id="boot-day"></p>
    </div>
    <!-- NAVIGATION CONTROLS: first in the DOM, so it is the first Tab stop -->
    <div class="nav-controls">
      <div class="timeline-heading">
        <span class="timeline-star" aria-hidden="true"></span>
        <span class="timeline-heading-title">REISDAGBOEK</span>
        <span class="timeline-divider" aria-hidden="true"></span>
        <span class="timeline-heading-meta">15 FEB — 4 MRT 2027</span>
        <span class="timeline-hint">· SCROLL DE ROUTE →</span>
      </div>
      <nav
        class="page-indicators"
        id="page-indicators"
        aria-label="Reistijdlijn: pijltjestoetsen wisselen van dag"
      ></nav>
      <div class="nav-actions">
        <button class="nav-btn nav-btn-prev" aria-label="Vorige pagina">
          <span class="nav-arrow" aria-hidden="true">▶</span>
        </button>
        <span
          class="progress-text"
          id="progress"
          aria-live="polite"
          aria-atomic="true"
        >
          <span class="progress-day">Dag 1</span>
          <span class="progress-icon" role="img" aria-label="Vlucht">✈️</span>
        </span>
        <button class="nav-btn nav-btn-next" aria-label="Volgende pagina">
          <span class="nav-arrow" aria-hidden="true">▶</span>
        </button>
      </div>
    </div>

    <div
      class="map-background"
      id="trip-map"
      role="region"
      aria-label="Minimap met de reisdagen in Laos en Cambodja"
    >
      <div class="map-shade" aria-hidden="true"></div>
      <svg class="map-popup-beam" id="map-popup-beam" aria-hidden="true">
        <g class="map-popup-beam-bars"></g>
      </svg>
    </div>
    <div class="map-status" id="map-status" role="status">Kaart laden…</div>
    <button class="sound-btn" type="button" aria-pressed="true">
      SFX: ON 🔊
    </button>
    <div class="map-attribution">
      <a
        href="https://www.openmaptiles.org/"
        target="_blank"
        rel="noopener noreferrer"
        >© OpenMapTiles</a
      >
      ·
      <a
        href="https://www.openstreetmap.org/copyright"
        target="_blank"
        rel="noopener noreferrer"
        >© OpenStreetMap</a
      >
    </div>
    <div class="deck"></div>
    <!-- One day card; js/slides/build.js fills a copy for every stop -->
    <template id="slide-template">
      <div class="slide">
        <div class="card">
          <div>
            <span class="tag"></span>
            <h2></h2>
            <p class="desc"></p>
            <blockquote></blockquote>
            <div class="stats-bar">
              <div class="stat-item">
                REISDAG
                <div class="stat-value"></div>
              </div>
              <div class="stat-item">
                OVERNACHTING
                <div class="stat-value"></div>
              </div>
            </div>
          </div>
          <div class="img-box"><img alt="" /></div>
        </div>
      </div>
    </template>

    <script
      src="https://unpkg.com/maplibre-gl@5.6.2/dist/maplibre-gl.js"
      integrity="sha256-FSX5cSI9gfFp8EnxzlAIPm8WQ6prDqBxZlOlUNLVf8I="
      crossorigin=""
    ></script>
    <script type="module" src="js/main.js"></script>
  </body>
</html>
